[package]
name = "motorx-core"
version = "0.0.18"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["http", "server", "reverse-proxy"]
homepage = "https://github.com/tsar-boomba/motorx"
repository = "https://github.com/tsar-boomba/motorx"
readme = "README.md"
publish = true
description = "Build your own motorx binary."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
http-body = "1.0.1"
http-body-util = "0.1.3"
bytes = "1.10.1"
http = "1.3.1"
regex = "1.11.2"
once_cell = { version = "1.21.3", features = ["parking_lot"] }
thiserror = "2.0.16"
tokio = { workspace = true, features = ["net", "rt", "macros", "parking_lot"] }
hyper = { version = "1.7.0", features = ["full"] }
hyper-util = { version = "0.1.17", features = ["tokio", "http1", "http2", "server"] }
tokio-util = "0.7.16"
slab = "0.4.11"
itertools = "0.14.0"
futures-util = "0.3.31" 

# logging feature
tracing = { workspace = true }

# tls feature
rustls-native-certs = { version = "0.8.1", optional = true }
rustls = { version = "0.23.31", default-features = false, optional = true, features = ["aws-lc-rs"] }
tokio-rustls = { version = "0.26.3", default-features = false, optional = true  }
rustls-acme = { version = "0.15.0", optional = true, features = ["tokio"] }
tokio-stream = { version = "0.1.17", optional = true, features = ["net"] }

# json-config feature
serde = { version = "1.0.225", features = ["derive", "rc"], optional = true }
serde_json = { version = "1.0.145", optional = true }
http-serde = { version = "2.1.1", optional = true }

# h3 feature
# s2n v1.54.0
s2n-quic-core = { optional = true, git = "https://github.com/aws/s2n-quic.git", rev = "d2f6bfaf5f5ad168223a0b5f9ba27e60435bd219", default-features = false }
s2n-quic = { optional = true, git = "https://github.com/aws/s2n-quic.git", rev = "d2f6bfaf5f5ad168223a0b5f9ba27e60435bd219", default-features = false, features = ["provider-address-token-default", "provider-tls-rustls"] }
s2n-quic-h3 = { optional = true, git = "https://github.com/aws/s2n-quic.git", rev = "d2f6bfaf5f5ad168223a0b5f9ba27e60435bd219", features = ["tracing"] }

# prometheus feature
prometheus-client = { optional = true, version = "0.23.1" }

[dev-dependencies]
reqwest = { version = "0.12.23", features = ["rustls-tls", "http3"] } # to send request to proxy in tests
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
rcgen = { version = "0.13.2" }
tempfile = "3.22.0"
maplit = "1.0.2"

[features]
full = ["serde-config", "tls", "h3", "prometheus"]

serde-config = ["serde", "serde_json", "http-serde"]

tls = ["rustls", "rustls-native-certs", "tokio-rustls", "rustls-acme", "tokio-stream"]

h3 = ["tls", "s2n-quic-core", "s2n-quic", "s2n-quic-h3"]

prometheus = ["dep:prometheus-client"]
