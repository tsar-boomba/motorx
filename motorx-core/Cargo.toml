[package]
name = "motorx-core"
version = "0.0.18"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["http", "server", "reverse-proxy"]
homepage = "https://github.com/tsar-boomba/motorx"
repository = "https://github.com/tsar-boomba/motorx"
readme = "README.md"
publish = true
description = "Build your own motorx binary."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
http-body = "1.0.1"
http-body-util = "0.1.2"
bytes = "1.8.0"
http = "1.1.0"
regex = "1.11.1"
once_cell = { version = "1.20.2", features = ["parking_lot"] }
thiserror = "2.0.0"
tokio = { workspace = true, features = ["net", "rt", "macros", "parking_lot"] }
hyper = { version = "1.5.0", features = ["full"] }
hyper-util = { version = "0.1.10", features = ["tokio", "http1", "http2", "server"] }
tokio-util = "0.7.13"
slab = "0.4.9"
itertools = "0.14.0"

# logging feature
tracing = { workspace = true }

# tls feature
rustls-native-certs = { version = "0.8.1", optional = true }
rustls = { version = "0.23.21", default-features = false, optional = true, features = ["ring"] }
rustls-pemfile = { version = "2.2.0", optional = true }
tokio-rustls = { version = "0.26.1", default-features = false, optional = true  }
webpki-roots = { version = "0.26.7", optional = true }
futures-util = { version = "0.3.31", optional = true }
rustls-acme = { version = "0.12.1", optional = true, features = ["tokio"] }
tokio-stream = { version = "0.1.17", optional = true, features = ["net"] }

# json-config feature
serde = { version = "1.0.217", features = ["derive", "rc"], optional = true }
serde_json = { version = "1.0.137", optional = true }
http-serde = { version = "2.1.1", optional = true }

# h3 feature
# s2n v1.54.0
s2n-quic-core = { optional = true, git = "https://github.com/aws/s2n-quic.git", rev = "65d6b6ea6fc68d845b98dc1ea5b7f96ad7bb9d0a", default-features = false, features = ["state-tracing", "branch-tracing", "event-tracing", "probe-tracing"] }
s2n-quic = { optional = true, git = "https://github.com/aws/s2n-quic.git", rev = "65d6b6ea6fc68d845b98dc1ea5b7f96ad7bb9d0a", default-features = false, features = ["provider-address-token-default", "provider-tls-rustls"] }
s2n-quic-h3 = { optional = true, git = "https://github.com/aws/s2n-quic.git", rev = "65d6b6ea6fc68d845b98dc1ea5b7f96ad7bb9d0a", features = ["tracing"] }

[dev-dependencies]
reqwest = { version = "0.12.12", features = ["rustls-tls", "http3"] } # to send request to proxy in tests
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
rcgen = { version = "0.13.2" }
tempfile = "3.15.0"
maplit = "1.0.2"

[features]
full = ["logging", "serde-config", "tls", "h3"]

logging = []

serde-config = ["serde", "serde_json", "http-serde"]

tls = ["rustls", "rustls-native-certs", "rustls-pemfile", "tokio-rustls", "webpki-roots", "futures-util", "rustls-acme", "tokio-stream"]

h3 = ["tls", "s2n-quic-core", "s2n-quic", "s2n-quic-h3"]
